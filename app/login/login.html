<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none';">
    <link rel="stylesheet" href="login.css">
    <title>Login Dialog</title>
</head>

<body>

    <form name="form" id="login-form">
        <input type="email" name="username" id="username" placeholder="email of/or domain\username" autofocus>
        <input type="password" name="password" id="password" placeholder="Password">
        <input type="submit" value="Submit">
    </form>

    <script src="formSender.js" defer></script>
</body>

</html>
